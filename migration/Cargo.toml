[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-std = { version = "1", features = ["attributes", "tokio1"] }
async-trait = "0.1"

[dependencies.sea-orm-migration]
version = "0.12"
default-features = false
features = [
  "runtime-tokio-native-tls",
  "sqlx-postgres",
]
