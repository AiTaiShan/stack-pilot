version: '3.8'

services:
  # Rust 主服务
  backend:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - "9099:9099"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/stackpilot
      - REDIS_URL=redis://redis:6379
      - AGENT_SERVICE_URL=http://agent:9091
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Python Agent 审核服务
  agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    ports:
      - "9091:9091"
    env_file:
      - .env
    restart: unless-stopped

  # PostgreSQL 数据库
  db:
    image: postgres:15
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=stackpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d stackpilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
