apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackpilot-backend
  labels:
    app: stackpilot-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stackpilot-backend
  template:
    metadata:
      labels:
        app: stackpilot-backend
    spec:
      containers:
        - name: backend
          image: stackpilot-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: stackpilot-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: stackpilot-secrets
                  key: redis-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stackpilot-secrets
                  key: jwt-secret-key
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: stackpilot-secrets
                  key: llm-api-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: stackpilot-backend-service
spec:
  selector:
    app: stackpilot-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stackpilot-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: stackpilot.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stackpilot-backend-service
                port:
                  number: 80
